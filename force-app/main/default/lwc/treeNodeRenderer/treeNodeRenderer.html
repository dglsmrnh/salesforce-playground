<template>
  <article class="node-card">
    <div class="node-card__accent" aria-hidden="true"></div>
    <div class="node-card__content">
      <div class="node-card__header">
        <div>
          <span class="node-card__eyebrow">Nó nível {depth}</span>
          <h3 data-node-name={node.name}>{node.label}</h3>
        </div>
        <span class={statusClass}>{status}</span>
      </div>

      <template lwc:if={node.description}>
        <p class="description">{node.description}</p>
      </template>

      <div class="node-card__footer">
        <span class="owner">Responsável: {owner}</span>
        <button type="button" onclick={handleAction}>Ver detalhes</button>
      </div>
    </div>
  </article>
</template>
